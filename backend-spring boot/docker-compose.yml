version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: ecommerce-mysql
    environment:
      MYSQL_DATABASE: ecommerce_multi_vendor
      MYSQL_ROOT_PASSWORD: Kavindu12345
      MYSQL_USER: ecommerce_user
      MYSQL_PASSWORD: ecommerce_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/main/resources/sample_data.sql:/docker-entrypoint-initdb.d/sample_data.sql
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Spring Boot Application
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecommerce-backend
    environment:
      # Database Configuration
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ecommerce_multi_vendor
      DB_USERNAME: ecommerce_user
      DB_PASSWORD: ecommerce_pass
      
      # Payment Gateway (Set these in production)
      RAZORPAY_KEY: ${RAZORPAY_KEY:-}
      RAZORPAY_SECRET: ${RAZORPAY_SECRET:-}
      STRIPE_KEY: ${STRIPE_KEY:-}
      
      # Email Configuration (Set these in production)
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      
      # AI Configuration (Set these in production)
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      
      # Spring Profile
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "5454:5454"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - ecommerce-network
    volumes:
      - app_logs:/app/logs
    restart: unless-stopped

volumes:
  mysql_data:
    driver: local
  app_logs:
    driver: local

networks:
  ecommerce-network:
    driver: bridge