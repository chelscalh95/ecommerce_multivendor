services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: ecommerce-mysql
    environment:
      MYSQL_DATABASE: ecommerce_multi_vendor
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-Kavindu12345}
      MYSQL_USER: ${DB_USERNAME:-ecommerce_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-ecommerce_pass}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    restart: unless-stopped
    
  # Local SMTP server for email and OTP testing
  mailpit:
    image: axllent/mailpit:v1.30.0
    container_name: ecommerce-mailpit
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web inbox and REST API
    networks:
      - ecommerce-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      
  # Spring Boot Backend
  backend:
    build:
      context: ./backend-spring boot
      dockerfile: Dockerfile
    container_name: ecommerce-backend
    environment:
      # Database Configuration
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ecommerce_multi_vendor
      DB_USERNAME: ${DB_USERNAME:-ecommerce_user}
      DB_PASSWORD: ${DB_PASSWORD:-ecommerce_pass}
      
      # Payment Gateway Configuration
      RAZORPAY_KEY: ${RAZORPAY_KEY:-}
      RAZORPAY_SECRET: ${RAZORPAY_SECRET:-}
      STRIPE_KEY: ${STRIPE_KEY:-}
      
      # Email Configuration - Local Mailpit SMTP configuration
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
      SPRING_MAIL_USERNAME: qa@ecommerce.test
      SPRING_MAIL_PASSWORD: ""
      SPRING_MAIL_PROPERTIES_MAIL_FROM: qa@ecommerce.test
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "false"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "false"
      
      # AI Configuration
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      
      # JWT Configuration
      JWT_SECRET: ${JWT_SECRET:-your_jwt_secret_key_here}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      
      # Spring Configuration
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "5454:5454"
    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    networks:
      - ecommerce-network
    volumes:
      - backend_logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:5454/v3/api-docs"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # React Frontend
  frontend:
    build:
      context: ./fontend-react
      dockerfile: Dockerfile
    container_name: ecommerce-frontend
    environment:
      # API Configuration
      REACT_APP_API_URL: http://backend:5454
      REACT_APP_DOCKER: "true"
      
      # Payment Configuration
      REACT_APP_STRIPE_PUBLIC_KEY: ${REACT_APP_STRIPE_PUBLIC_KEY:-}
      REACT_APP_RAZORPAY_KEY: ${REACT_APP_RAZORPAY_KEY:-}
      
      # Feature Flags
      REACT_APP_ENABLE_AI_CHATBOT: ${REACT_APP_ENABLE_AI_CHATBOT:-true}
      REACT_APP_ENABLE_WISHLIST: ${REACT_APP_ENABLE_WISHLIST:-true}
      REACT_APP_ENABLE_REVIEWS: ${REACT_APP_ENABLE_REVIEWS:-true}
      
      # App Configuration
      REACT_APP_NAME: "E-Commerce Multi Vendor"
      REACT_APP_VERSION: "1.0.0"
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - ecommerce-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Reverse Proxy (Optional - for production-like setup)
  nginx:
    image: nginx:alpine
    container_name: ecommerce-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - frontend
      - backend
    networks:
      - ecommerce-network
    restart: unless-stopped
    profiles:
      - production

  # Redis (Optional - for caching)
  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ecommerce-network
    restart: unless-stopped
    profiles:
      - production
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}

  # Elasticsearch (Optional - for advanced search)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: ecommerce-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - ecommerce-network
    restart: unless-stopped
    profiles:
      - advanced

  # Kibana (Optional - for Elasticsearch visualization)
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: ecommerce-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - ecommerce-network
    restart: unless-stopped
    profiles:
      - advanced

  # Monitoring with Prometheus (Optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: ecommerce-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - ecommerce-network
    restart: unless-stopped
    profiles:
      - monitoring

  # Grafana for Metrics Visualization (Optional)
  grafana:
    image: grafana/grafana:latest
    container_name: ecommerce-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - ecommerce-network
    restart: unless-stopped
    profiles:
      - monitoring

# Volumes for persistent data
volumes:
  mysql_data:
    driver: local
  backend_logs:
    driver: local
  nginx_logs:
    driver: local
  redis_data:
    driver: local
  elasticsearch_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

# Networks
networks:
  ecommerce-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16