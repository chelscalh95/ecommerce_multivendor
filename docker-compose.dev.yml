version: '3.8'

# Development Docker Compose Configuration
# This is a simplified version for local development

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: ecommerce-mysql-dev
    environment:
      MYSQL_DATABASE: ecommerce_multi_vendor
      MYSQL_ROOT_PASSWORD: Kavindu12345
      MYSQL_USER: ecommerce_user
      MYSQL_PASSWORD: ecommerce_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_dev_data:/var/lib/mysql
      - ./backend-spring boot/src/main/resources/sample_data.sql:/docker-entrypoint-initdb.d/sample_data.sql
    networks:
      - ecommerce-dev-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Spring Boot Backend (Development Mode)
  backend:
    build:
      context: ./backend-spring boot
      dockerfile: Dockerfile
      target: development  # If multi-stage build is available
    container_name: ecommerce-backend-dev
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ecommerce_multi_vendor
      DB_USERNAME: ecommerce_user
      DB_PASSWORD: ecommerce_pass
      SPRING_PROFILES_ACTIVE: development
      SPRING_DEVTOOLS_RESTART_ENABLED: true
      SPRING_DEVTOOLS_LIVERELOAD_ENABLED: true
    ports:
      - "5454:5454"
      - "35729:35729"  # LiveReload port
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - ecommerce-dev-network
    volumes:
      - ./backend-spring boot/src:/app/src:ro  # Mount source for hot reload
      - backend_dev_logs:/app/logs
    restart: unless-stopped

  # React Frontend (Development Mode)
  frontend:
    build:
      context: ./fontend-react
      dockerfile: Dockerfile.dev  # Development Dockerfile
    container_name: ecommerce-frontend-dev
    environment:
      REACT_APP_API_URL: http://localhost:5454
      REACT_APP_DOCKER: "false"
      CHOKIDAR_USEPOLLING: "true"  # For file watching in Docker
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - ecommerce-dev-network
    volumes:
      - ./fontend-react/src:/app/src:delegated  # Mount source for hot reload
      - ./fontend-react/public:/app/public:delegated
      - /app/node_modules  # Anonymous volume for node_modules
    restart: unless-stopped
    stdin_open: true  # For React interactive mode
    tty: true

  # Redis (for development caching)
  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis-dev
    ports:
      - "6379:6379"
    networks:
      - ecommerce-dev-network
    command: redis-server --appendonly yes

volumes:
  mysql_dev_data:
    driver: local
  backend_dev_logs:
    driver: local

networks:
  ecommerce-dev-network:
    driver: bridge